<!doctype html>
<html lang="zh-CN" data-dumber-platform="x">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUMBER integration fixture</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 1800px; background: #000; color: #f2f3f5; }
    main { width: 620px; margin: 42px auto; }
    article {
      position: relative;
      display: block;
      margin: 0 0 28px;
      padding: 20px;
      background: #0f1016;
      border: 1px solid #2f3138;
      border-radius: 16px;
    }
    [data-testid="tweetText"] { font-size: 16px; line-height: 1.35; }
  </style>
  <script>
    const platform = "x";
    document.documentElement.dataset.dumberPlatform = platform;

    const settings = {
      schemaVersion: 2,
      enabled: true,
      apiBaseUrl: "https://api.example.test/v1",
      apiKey: "fixture-key",
      model: "fixture-model",
      promotionThreshold: .72,
      xEnabled: true,
      bilibiliEnabled: false,
      personalizationEnabled: true,
      requestTimeoutMs: 12000
    };
    let profile = { schemaVersion: 2, drivers: {}, accounts: {}, topics: {}, items: {}, totalActions: 0, updatedAt: 0 };
    const changeListeners = [];
    window.__dumberTest = { curateCalls: 0, emphasisCalls: 0, preferences: [], events: [] };

    window.chrome = {
      runtime: {
        sendMessage: async (message) => {
          if (message.type === "curate") {
            window.__dumberTest.curateCalls += 1;
            return {
              ok: true,
              curations: message.items.map((item) => ({
                id: item.id,
                promote: true,
                dopamineScore: .93,
                durableValue: .18,
                primaryDriver: "identity_resonance",
                promotionLabel: "高共鸣",
                cacheHit: false
              }))
            };
          }
          if (message.type === "emphasize") {
            window.__dumberTest.emphasisCalls += 1;
            return {
              ok: true,
              emphasis: { phrases: ["惊人", "想不到"], cacheHit: false }
            };
          }
          if (message.type === "preferenceAction") {
            window.__dumberTest.preferences.push(message.action);
            profile = window.DumberShared.applyPreferenceAction(profile, message.action, message.context);
            return { ok: true, profile };
          }
          if (message.type === "runtimeEvents") {
            window.__dumberTest.events.push(...message.events);
            return { ok: true };
          }
          return { ok: true };
        },
        getURL: (path) => new URL(`../${path}`, location.href).toString()
      },
      storage: {
        local: {
          get: async (keys) => {
            const values = { dumberSettings: settings, dumberPreferenceProfile: profile };
            if (typeof keys === "string") return { [keys]: values[keys] };
            return values;
          },
          set: async () => undefined
        },
        onChanged: {
          addListener: (listener) => changeListeners.push(listener)
        }
      }
    };
  </script>
</head>
<body>
  <main id="fixture"></main>

  <script>
    const fixture = document.querySelector("#fixture");
    fixture.innerHTML = `
      <article data-testid="tweet">
        <div data-testid="User-Name"><a href="/curator">Curator @curator</a></div>
        <div data-testid="tweetText">所有人都在讨论的惊人结论：你绝对想不到最后发生了什么。</div>
        <a href="/curator/status/100"><time>刚刚</time></a>
        <button data-testid="like">999</button>
      </article>
    `;
  </script>
  <script src="../src/shared.js"></script>
  <script src="../src/adapters/index.js"></script>
  <script src="../src/adapters/x.js"></script>
  <script src="../src/renderer.js"></script>
  <script src="../src/content.js"></script>
</body>
</html>
